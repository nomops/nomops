packages:
  - "packages/*"

allowBuilds:
  argon2: true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  isolated-vm: true
  msgpackr-extract: false
  sharp: true
  ssh2: true
  vue-demi: true

# 标准 pnpm 的构建放行清单（Docker 构建等无 hook 环境使用）。
onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - argon2
  - sharp
  - ssh2
  - vue-demi
